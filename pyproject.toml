[project]
name = "liveclips"
version = "0.1.0"
description = "Clipa lives BR de GTA 6, avalia com IA e publica automaticamente."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "aiohttp>=3.9",
    "pydantic>=2.7",
    "anthropic>=1.0",
    "google-genai>=1.0",
    "google-api-python-client>=2.130",
    "google-auth>=2.29",
    "discord.py>=2.4",
    "faster-whisper>=1.0",
    "yt-dlp[default]",
    "tzdata",
    "numpy",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", "tests"]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
